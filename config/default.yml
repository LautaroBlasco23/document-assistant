llm_provider: ""  # set via DOCASSIST_LLM_PROVIDER env var or edit here
flashcard_model: "main"  # "main" | "fast" -- use "fast" for speed, "main" for quality

ollama:
  base_url: "http://localhost:11434"
  generation_model: ""  # set via DOCASSIST_OLLAMA__GENERATION_MODEL
  fast_model: ""  # Smaller model for bulk generation tasks
  timeout: 300

groq:
  # api_key: set via DOCASSIST_GROQ__API_KEY env var (never commit keys here)
  base_url: "https://api.groq.com/openai/v1"
  model: ""  # set via DOCASSIST_GROQ__MODEL
  fast_model: ""
  timeout: 60
  max_retries: 3
  max_retries_chat: 1
  requests_per_minute: 25  # proactive rate limit for Groq free tier

openrouter:
  # api_key: set via DOCASSIST_OPENROUTER__API_KEY env var (never commit keys here)
  base_url: "https://openrouter.ai/api/v1"
  model: ""  # set via DOCASSIST_OPENROUTER__MODEL
  fast_model: ""
  timeout: 120
  max_retries: 3
  requests_per_minute: 10  # proactive rate limit; reduce further for :free models if 429s persist

huggingface:
  # api_key: set via DOCASSIST_HUGGINGFACE__API_KEY env var (never commit keys here)
  base_url: "https://router.huggingface.co/v1"
  model: ""  # set via DOCASSIST_HUGGINGFACE__MODEL
  timeout: 180
  max_retries: 3
  max_retries_chat: 1
  requests_per_minute: 80  # proactive rate limit for HuggingFace free tier
  wait_for_model: true

nvidia:
  # api_key: set via DOCASSIST_NVIDIA__API_KEY env var (never commit keys here)
  base_url: "https://integrate.api.nvidia.com/v1"
  model: ""  # set via DOCASSIST_NVIDIA__MODEL
  fast_model: ""
  timeout: 300
  max_retries: 3
  max_retries_chat: 1
  requests_per_minute: 35  # proactive rate limit for NVIDIA free tier

gemini:
  # api_key: set via DOCASSIST_GEMINI__API_KEY env var (never commit keys here)
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  model: ""  # set via DOCASSIST_GEMINI__MODEL
  fast_model: ""
  timeout: 120
  max_retries: 3
  max_retries_chat: 1
  requests_per_minute: 8  # Flash has hard 250 RPD cap; Flash-Lite 1000 RPD

llamacpp:
  base_url: "http://localhost:8080/v1"
  model: ""  # set via DOCASSIST_LLAMACPP__MODEL
  fast_model: ""  # set via DOCASSIST_LLAMACPP__FAST_MODEL
  timeout: 300
  connect_timeout: 10
  max_retries: 3
  max_retries_chat: 1
  streaming: true

chunking:
  max_tokens: 512
  overlap_tokens: 128

postgres:
  host: "localhost"
  port: 5432
  database: "docassist"
  user: "docassist"
  password: "docassist_pass"

exam:
  cooldown_after_fail_hours: 2
  cooldown_completed_days: 4
  cooldown_gold_days: 14
  cooldown_platinum_days: 30

epub:
  chapter_depth: 1
  min_chapter_words: 100
