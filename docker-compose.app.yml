name: knowledge-trees-app

services:

  postgres:
    image: postgres:17.4-alpine
    container_name: docassist_app_postgres
    restart: unless-stopped
    expose:
      - 5432
    environment:
      POSTGRES_DB: docassist
      POSTGRES_USER: docassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docassist"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docassist_app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docassist_app_backend
    restart: unless-stopped
    environment:
      - DOCASSIST_POSTGRES__HOST=postgres
      - DOCASSIST_POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - DOCASSIST_OLLAMA__BASE_URL=http://host.docker.internal:11434
      - DOCASSIST_LLM_PROVIDER=${DOCASSIST_LLM_PROVIDER:-groq}
      - DOCASSIST_GROQ__API_KEY=${DOCASSIST_GROQ__API_KEY:-}
      - DOCASSIST_OPENROUTER__API_KEY=${DOCASSIST_OPENROUTER__API_KEY:-}
      - DOCASSIST_HUGGINGFACE__API_KEY=${DOCASSIST_HUGGINGFACE__API_KEY:-}
      - DOCASSIST_AUTH__JWT_SECRET=${DOCASSIST_AUTH__JWT_SECRET:-}
      - DOCASSIST_AUTH__ENCRYPTION_KEY=${DOCASSIST_AUTH__ENCRYPTION_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - docassist_app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docassist_app_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - docassist_app_network

  nginx:
    image: nginx:1.27-alpine
    container_name: docassist_app_nginx
    restart: unless-stopped
    ports:
      - "3500:80"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - FORWARDED_PROTO=${FORWARDED_PROTO:-http}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - docassist_app_network

volumes:
  postgres_app_data:

networks:
  docassist_app_network:
    driver: bridge
